<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio DOM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contenedor">

        <header class="hero">
            <h1 id="titulo-principal">Laboratorio de Manipulación del DOM</h1>
            <p>Usa la consola del navegador para completar las misiones.</p>
        </header>

        <section class="tarjeta" id="tarjeta-1">
            <h2>Tarjeta 1</h2>
            <p>
                Esta tarjeta será utilizada en la misión de desaparición.
            </p>
        </section>

        <section class="tarjeta perfil">
            <img
                id="imagen-avatar"
                src="avatar.jpg" 
                alt="Avatar misterioso"
            >

            <h2 id="nombre-usuario">Usuario Misterioso</h2>

            <p id="descripcion">
                Mi identidad aún no ha sido modificada.
            </p>
        </section>

        <section class="tarjeta" id="caja-sorpresa">
            <h2>Caja de Colores</h2>
            <p>
                Cambia mis colores usando JavaScript desde la consola.
            </p>
        </section>

    </div>

</body>
</html>
